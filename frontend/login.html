<!DOCTYPE html>

<head>

    <title>লগইন - HealthCare Plus</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=3">
    <link rel="stylesheet" href="assets/css/animations.css">

<style>
    @media (min-width: 1200px) {
        .navbar-nav .nav-link {
            font-size: 0.95rem !important;
            padding-left: 0.6rem !important;
            padding-right: 0.6rem !important;
            white-space: nowrap;
        }
        .navbar-brand {
            font-size: 1.2rem !important;
        }
    }
</style>
</head>
<body style="background: linear-gradient(135deg, #0a1628 0%, #0f3460 50%, #0a1628 100%); min-height: 100vh;">

<!-- Navbar -->
<nav class="navbar navbar-expand-xl navbar-light fixed-top glass-nav">
    <div class="container-fluid px-xl-5">
        <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-notes-medical"></i> HealthCare Plus</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                <li class="nav-item"><a class="nav-link fw-bold text-primary" href="chatbot.html"><i class="fa-solid fa-robot me-1"></i> AI চ্যাটবট</a></li>
                <li class="nav-item"><a class="nav-link fw-bold text-info" href="scanner.html"><i class="fa-solid fa-camera me-1"></i> AI Meal স্ক্যানার</a></li>
                <li class="nav-item"><a class="nav-link" href="calculators.html">ক্যালকুলেটর</a></li>
                
                <li class="nav-item ms-lg-2">
                    <a class="nav-link btn btn-outline-danger text-danger rounded-pill px-4 fw-bold hover-white" href="#" onclick="event.preventDefault(); window.unsubscribeUser();">
                        <i class="fa-solid fa-sign-out-alt me-1"></i> আনসাবস্ক্রাইব
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Particles -->
<div class="particles-container" style="position:fixed; z-index:0;">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
</div>

<div class="main-content-wrapper d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px); position: relative; z-index: 1;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 p-0 shadow-lg overflow-hidden" style="border-radius: 24px; background: var(--bg-surface);" data-aos="zoom-in">
                    <!-- Gradient top bar -->
                    <div style="height: 5px; background: linear-gradient(90deg, #0066ff, #00b4d8, #00c853);"></div>
                    <div class="p-4 pt-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width:72px; height:72px; border-radius:18px; background: linear-gradient(135deg, rgba(0,102,255,0.1), rgba(0,180,216,0.08));">
                                <i class="fa-solid fa-right-to-bracket fa-xl" style="color: var(--primary);"></i>
                            </div>
                            <h3 class="fw-bold" style="color: var(--text-heading);">লগইন করুন</h3>
                            <p class="text-muted small">এটি একটি ডেমো ভার্সন, যেকোনো তথ্য দিয়ে লগইন করতে পারেন।</p>
                        </div>

                        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                            <div class="mb-3">
                                <label class="form-label">ইমেইল এড্রেস</label>
                                <div class="input-group">
                                    <span class="input-group-text border-0" style="background: rgba(0,102,255,0.05);"><i class="fa-solid fa-envelope" style="color: var(--primary);"></i></span>
                                    <input type="email" class="form-control" value="demo@example.com" required style="border-left:0;">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">পাসওয়ার্ড</label>
                                <div class="input-group">
                                    <span class="input-group-text border-0" style="background: rgba(0,102,255,0.05);"><i class="fa-solid fa-lock" style="color: var(--primary);"></i></span>
                                    <input type="password" class="form-control" value="password123" required style="border-left:0;">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">
                                <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> লগইন
                            </button>
                        </form>

                        <div class="text-center mt-4 mb-2 text-muted small">
                            অ্যাকাউন্ট নেই? <a href="register.html" class="text-decoration-none fw-bold" style="color: var(--primary);">নতুন অ্যাকাউন্ট খুলুন</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init({duration: 800, once: true});</script>

<!-- Universal Footer Card -->
<style>
    @media (max-width: 767px) { body { padding-bottom: 60px !important; } }
    .universal-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 3px solid #0072ff !important;
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
        box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        z-index: 1050;
        padding: 12px 20px;
        text-align: center;
        color: #1e293b;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.3s ease;
    }
</style>
<div class="universal-footer d-md-none">
    <i class="fa-solid fa-heart-pulse text-danger"></i> 
    <span>&copy; ২০২৬ HealthCare Plus. সর্বস্বত্ব সংরক্ষিত।</span>
</div>
