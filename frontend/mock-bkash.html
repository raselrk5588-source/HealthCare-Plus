<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bKash Payment Gateway (Mock)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #E2136E; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif; }
        .payment-box { background: white; color: #333; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .logo { width: 120px; margin-bottom: 20px; }
        .btn-bkash { background-color: #E2136E; color: white; width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; border: none; margin-top: 15px; }
        .btn-bkash:hover { background-color: #c90f5e; color: white; }
        .btn-cancel { background-color: #f1f1f1; color: #333; width: 100%; padding: 12px; font-weight: bold; border-radius: 8px; border: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="payment-box">
    <img src="https://scripts.sandbox.bka.sh/resources/img/bkash_payment_logo.png" alt="bKash" class="logo">
    <h5 class="fw-bold mb-3">Merchant: HealthCare Plus</h5>
    
    <div class="mb-4 text-start">
        <label class="form-label text-muted small fw-bold">bKash Account Number</label>
        <input type="text" class="form-control text-center fs-5" placeholder="01XXXXXXXXX" value="01712345678" disabled>
    </div>

    <div class="mb-4 text-start">
        <label class="form-label text-muted small fw-bold">PIN</label>
        <input type="password" class="form-control text-center fs-5" placeholder="Enter PIN" value="12345" disabled>
    </div>

    <p class="text-danger small mb-3">This is a MOCK payment page. No real money will be deducted.</p>

    <button id="payBtn" class="btn btn-bkash">Confirm Payment</button>
    <button id="cancelBtn" class="btn btn-cancel">Cancel</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const callbackURL = urlParams.get('callbackURL');
    const paymentID = urlParams.get('paymentID');

    document.getElementById('payBtn').addEventListener('click', () => {
        if(callbackURL) {
            window.location.href = `${callbackURL}&paymentID=${paymentID}&status=success`;
        }
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
        if(callbackURL) {
            window.location.href = `${callbackURL}&paymentID=${paymentID}&status=cancel`;
        }
    });
</script>

</body>
</html>
